spring:
  application:
    name: obracerta

  datasource:
    url: jdbc:postgresql://localhost:5432/obracerta
    username: obracerta
    password: obracerta

  jpa:
    open-in-view: false
    hibernate:
      # O esquema e controlado pelo Flyway. Nunca use update aqui.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        # Serializa Page como {content, page:{size, number, totalElements, totalPages}}.
        # O modo padrao (DIRECT) expoe a estrutura interna do PageImpl e muda entre versoes.
        serialization-mode: via-dto
        max-page-size: 100

  modulith:
    # So e modulo o pacote que tiver @ApplicationModule no package-info.
    # A verificacao das dependencias entre modulos roda no ModularityTest.
    detection-strategy: explicitly-annotated

logging:
  level:
    org.springframework.modulith: INFO

server:
  port: 8080
