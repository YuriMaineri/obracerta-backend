services:
  db:
    image: postgres:17-alpine
    container_name: obracerta-db
    environment:
      POSTGRES_DB: obracerta
      POSTGRES_USER: obracerta
      POSTGRES_PASSWORD: obracerta
    ports:
      - "5432:5432"
    volumes:
      - obracerta-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obracerta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  obracerta-dados:
