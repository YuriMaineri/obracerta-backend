spring:
  application:
    name: obracerta

  datasource:
    url: jdbc:postgresql://localhost:5432/obracerta
    username: obracerta
    password: obracerta

  jpa:
    open-in-view: false
    hibernate:
      # O esquema é do Flyway; nunca use update.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        # Page como {content, page:{...}}, estável entre versões.
        serialization-mode: via-dto
        max-page-size: 100

  modulith:
    detection-strategy: explicitly-annotated

logging:
  level:
    org.springframework.modulith: INFO

server:
  port: 8080
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

# Primeiro usuário, criado na subida só se não existir nenhum. A senha vem de variável de ambiente, nunca do Git.
obracerta:
  admin:
    name: ${OBRACERTA_ADMIN_NAME:Administrador}
    email: ${OBRACERTA_ADMIN_EMAIL:}
    password: ${OBRACERTA_ADMIN_PASSWORD:}
